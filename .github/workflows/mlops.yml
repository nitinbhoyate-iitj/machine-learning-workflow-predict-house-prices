name: ML Workflow

on:
  push:
    branches:
      - kernelridge

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Decision Tree
        run: python train.py || echo "train.py not in branch"

      - name: Run Kernel Ridge
        run: python train2.py || echo "train2.py not in branch"
